name: coverage

# Line coverage (cloverage) for the COV-FLEET program (kanban 20261014203120-0832c308).
# Reports only (--fail-threshold 0): it publishes the number in the job summary
# and as an artifact; raise the threshold once the repo holds 70%.
# Runs unchanged on GitHub Actions and Gitea Actions (official CLI installer).

on:
  push:
    branches: [staging, 'cov/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cloverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/clj-install.sh \
            https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x /tmp/clj-install.sh
          sudo /tmp/clj-install.sh
      - name: Cloverage
        run: |
          set -euo pipefail
          # :cov comes last, so its :main-opts replace the :test runner's.
          clojure -J-Xmx3g \
            -Sdeps '{:aliases {:cov {:extra-deps {cloverage/cloverage {:mvn/version "1.2.4"}} :main-opts ["-m" "cloverage.coverage"]}}}' \
            -M:test:cov -p src -s test --test-ns-regex 'hive-addon\..*-test' \
            --no-html --text --summary --codecov --fail-threshold 0 -o target/coverage \
            | tee coverage-summary.txt
          { echo '## Line coverage'; echo '```'; tail -n 60 coverage-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            target/coverage
            coverage-summary.txt
