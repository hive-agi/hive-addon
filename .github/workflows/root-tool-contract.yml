name: root-tool-contract

# Reusable gate for any IAddon repo: every tool its addon contributes must
# satisfy hive-addon.tool-contract/RootToolDef (non-blank name + description,
# inputSchema of type "object" with at least one property).
#
#   jobs:
#     root-tools:
#       uses: hive-agi/hive-addon/.github/workflows/root-tool-contract.yml@main
#       with:
#         addon-ctors: my.addon/->addon
#         require-descriptions: true   # optional: fail on an undescribed property
#
# Or let the repo's own mount manifests name the ctors (no per-repo list):
#
#         manifests: true
#
# Repos without this workflow (Gitea, or the shared staging-gate.yml) run the
# same check as one CI line:
#
#   clojure -Sdeps '{:aliases {:rtc {:main-opts ["-m" "hive-addon.tool-contract.check"]}}}' -M:rtc --manifests
#
# The repo's classpath must carry hive-addon >= the release that ships
# hive-addon.tool-contract (directly or transitively).
on:
  workflow_call:
    inputs:
      addon-ctors:
        description: Space-separated zero-arg fns returning an IAddon, e.g. "my.addon/->addon". Optional when manifests is true.
        required: false
        type: string
        default: ""
      manifests:
        description: Also check every ctor named by the repo's own resources/META-INF/hive-addons/*.edn whose :addon/capabilities has :tools (fails if none is found).
        required: false
        type: boolean
        default: false
      aliases:
        description: deps.edn aliases to add to the classpath, e.g. ":dev" (no main-opts are used from them).
        required: false
        type: string
        default: ""
      require-descriptions:
        description: Fail when a tool property has no non-blank :description (otherwise it is only a warning).
        required: false
        type: boolean
        default: false

jobs:
  contract:
    name: root tool contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-

      - name: check addon tools
        env:
          ALIASES: ${{ inputs.aliases }}
          CTORS: ${{ inputs.addon-ctors }}
          FLAGS: ${{ inputs.require-descriptions && '--require-descriptions' || '' }}
          MANIFESTS: ${{ inputs.manifests && '--manifests' || '' }}
        run: |
          clojure -Sdeps '{:aliases {:root-tool-contract {:main-opts ["-m" "hive-addon.tool-contract.check"]}}}' \
            "-M${ALIASES}:root-tool-contract" $FLAGS $MANIFESTS $CTORS
